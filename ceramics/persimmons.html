<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Persimmons — Brian Le</title>
  <meta name="description" content="Persimmons, 2026. Stoneware, oxide washes, underglaze, glaze.">
  <!-- Temporary serif: Fraunces Italic (free). Swap for licensed Gramercy later. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@1,9..144,100..900,0..100,0..1&display=swap">
  <link rel="stylesheet" href="../css/styles.css">
  <script>document.documentElement.classList.add("js")</script>
  <script src="../js/main.js" defer></script>
  <link rel="icon" type="image/png" href="../favicon.png">
  <link rel="apple-touch-icon" href="../apple-touch-icon.png">
</head>
<body>

  <header class="site-header">
    <!-- The glass orb (span.orb) can go back here in place of the name; its styles are kept in css/styles.css -->
    <a class="site-header__link site-header__name" href="../ceramics.html"><span data-oval>br-index/<span class="site-section">ceramics</span></span></a>
    <a class="site-header__link site-header__index" href="#index" role="button"><span data-oval>Contents</span></a>
  </header>

  <main class="work-page">

    <!-- One white sheet: a narrow metadata column on the left, photos on the right -->
    <div class="box work-sheet">

      <aside class="work-meta" aria-label="About Persimmon no. 1">
        <div class="work-meta__inner">
        <div class="work-card__cell">
          <p class="work-card__label">Title:</p>
          <h1 class="work-card__title">Persimmon no. 1</h1>
        </div>
        <div class="work-card__cell">
          <p class="work-card__label">Year:</p>
          <p class="work-card__value">2026</p>
        </div>
        <div class="work-card__cell">
          <p class="work-card__label">Dimensions:</p>
          <p class="work-card__value">7 × 7 × 7 in</p>
        </div>
        <div class="work-card__cell">
          <p class="work-card__label">Materials:</p>
          <p class="work-card__value">Stoneware, oxide washes, underglaze, glaze</p>
        </div>
        </div>
      </aside>

      <!-- Photos: repeating sets of one large photo on the left and two smaller
           photos stacked on the right. Copy a whole .work-set block to add another. -->
      <div class="work-photos">
        <div class="work-grid">
          <!-- Persimmon 1: the squat, upright one -->
          <div class="work-set">
            <img class="work-set__main" src="../images/ceramics/persimmon-1-high-angle.avif" data-full="../images/ceramics/persimmon-1-high-angle-large.avif" width="1600" height="1398" alt="Persimmon 1: a squat, upright ceramic persimmon with a glazed leaf cap and a twisted stem, seen from above at an angle">
            <img class="work-set__side" src="../images/ceramics/persimmon-1-side-view.avif" data-full="../images/ceramics/persimmon-1-side-view-large.avif" width="1300" height="998" loading="lazy" alt="Persimmon 1 from the side, showing its low, lobed body and long twisted stem">
            <img class="work-set__side" src="../images/ceramics/persimmon-1-top-down.avif" data-full="../images/ceramics/persimmon-1-top-down-large.avif" width="1300" height="998" loading="lazy" alt="Persimmon 1 from directly above: a four-part glazed leaf cap with a stem lying across it">
          </div>
        </div>
      </div>

    </div>

    <!-- Persimmon 2: the one lying on its side. Same sheet layout as above. -->
    <div class="box work-sheet">

      <aside class="work-meta" aria-label="About Persimmon no. 2">
        <div class="work-meta__inner">
        <div class="work-card__cell">
          <p class="work-card__label">Title:</p>
          <h2 class="work-card__title">Persimmon no. 2</h2>
        </div>
        <div class="work-card__cell">
          <p class="work-card__label">Year:</p>
          <p class="work-card__value">2026</p>
        </div>
        <div class="work-card__cell">
          <p class="work-card__label">Dimensions:</p>
          <p class="work-card__value">5 × 6 × 4.5 in</p>
        </div>
        <div class="work-card__cell">
          <p class="work-card__label">Materials:</p>
          <p class="work-card__value">Stoneware, oxide washes, underglaze, glaze</p>
        </div>
        </div>
      </aside>

      <div class="work-photos">
        <div class="work-grid">
          <div class="work-set">
            <img class="work-set__main" src="../images/ceramics/persimmon-2-side-view.avif" data-full="../images/ceramics/persimmon-2-side-view-large.avif" width="1600" height="1400" loading="lazy" alt="Persimmon 2: a ceramic persimmon lying on its side, with a ruffled green leaf cap and a short stem">
            <img class="work-set__side" src="../images/ceramics/persimmon-2-lid-off.avif" data-full="../images/ceramics/persimmon-2-lid-off-large.avif" width="1300" height="1000" loading="lazy" alt="Persimmon 2 opened: the hollow body beside its glazed leaf-cap lid">
            <img class="work-set__side" src="../images/ceramics/persimmon-2-top-down.avif" data-full="../images/ceramics/persimmon-2-top-down-large.avif" width="1300" height="998" loading="lazy" alt="Persimmon 2 from directly above, lying on its side with the leaf cap to the right">
          </div>
        </div>
      </div>

    </div>


  </main>

</body>
</html>
