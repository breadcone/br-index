<body>

  <header class="site-header">
    <!-- The glass orb (span.orb) can go back here in place of the name; its styles are kept in css/styles.css -->
    <a class="site-header__link site-header__name" href="../ceramics.html"><span data-oval>br-index/<span class="site-section">ceramics</span></span></a>
    <a class="site-header__link site-header__index" href="#index" role="button"><span data-oval>Contents</span></a>
  </header>

  <!-- data-popup-phone="square": on phones, enlarged photos open as squares (js/main.js) -->
  <main class="work-page" data-popup-phone="square">

    <!-- One white sheet: a narrow metadata column on the left, photos on the right -->
    <div class="box work-sheet">

      <aside class="work-meta" aria-label="About Persimmon 1">
        <div class="work-meta__inner">
        <div class="work-card__cell">
          <p class="work-card__label">Title:</p>
          <h1 class="work-card__title">Persimmon 1</h1>
        </div>
        <div class="work-card__cell">
          <p class="work-card__label">Year:</p>
          <p class="work-card__value">2026</p>
        </div>
        <div class="work-card__cell">
          <p class="work-card__label">Dimensions:</p>
          <p class="work-card__value">7 × 7 × 7 in</p>
        </div>
        <div class="work-card__cell">
          <p class="work-card__label">Materials:</p>
          <p class="work-card__value">Stoneware, oxide washes, underglaze, glaze</p>
        </div>
        </div>
      </aside>

      <!-- Photos: repeating sets of one large photo on the left and two smaller
           photos stacked on the right. Copy a whole .work-set block to add another. -->
      <div class="work-photos">
        <div class="work-grid">
          <!-- Persimmon 1: the squat, upright one -->
          <div class="work-set">
            <img class="work-set__main" src="../images/ceramics/persimmon-1/persimmon-1-high-angle.avif" data-full="../images/ceramics/persimmon-1/persimmon-1-high-angle-large.avif" width="1600" height="1398" alt="Persimmon 1: a squat, upright ceramic persimmon with a glazed leaf cap and a twisted stem, seen from above at an angle">
            <img class="work-set__side" src="../images/ceramics/persimmon-1/persimmon-1-side-view.avif" data-full="../images/ceramics/persimmon-1/persimmon-1-side-view-large.avif" width="1300" height="998" loading="lazy" alt="Persimmon 1 from the side, showing its low, lobed body and long twisted stem">
            <img class="work-set__side" src="../images/ceramics/persimmon-1/persimmon-1-top-down.avif" data-full="../images/ceramics/persimmon-1/persimmon-1-top-down-large.avif" width="1300" height="998" loading="lazy" alt="Persimmon 1 from directly above: a four-part glazed leaf cap with a stem lying across it">
          </div>
        </div>
      </div>

    </div>

  </main>
