  <main class="work-page" data-popup-phone="square">

    <!-- One white sheet: a narrow metadata column on the left, photos on the right -->
    <div class="box work-sheet">

      <aside class="work-meta" aria-label="About Trí Tuệ (Wisdom)">
        <div class="work-meta__inner">
        <div class="work-card__cell">

        <div class="work-card__cell">

          <p class="work-card__value">Stoneware, glaze</p>

        </div>

            <img class="work-set__side" src="../images/ceramics/patina-ritual/ritual-3-03.avif" width="790" height="790" loading="lazy" alt="The green vessel holding two pink cosmos flowers">

        </div>
      </div>
