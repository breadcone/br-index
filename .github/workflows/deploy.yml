# Publishes the site to GitHub Pages on every push to main.
# It runs scripts/build.sh first, which gives the CSS and JS fingerprinted
# names (e.g. styles.3f9a1c27b0.css) so visitors always get the latest
# versions. One-time setup: repo Settings -> Pages -> Source: GitHub Actions.
name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you re-run it from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site with versioned CSS and JS
        run: sh scripts/build.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
