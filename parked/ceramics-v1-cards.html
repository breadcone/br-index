<!--
  PARKED: the original ("v1") ceramics cards from ceramics.html, saved exactly
  as they were on 2026-11-15 when the new card style (.work-card--mosaic)
  replaced them. This file is not a page and is never published (scripts/
  build.sh skips the parked/ folder). Their styles are still in
  css/styles.css (.work-gallery and the card rules), so to bring a card back,
  paste its <article> into the right column of ceramics.html
  (<div class="home__right">).
-->

      <!-- Ceramic work card: title and year cells across the top, photo below.
           The top strip links to ceramics/persimmons.html. -->
      <article class="box card work-card">
        <a class="work-card__head card__link" href="ceramics/persimmons.html">
          <div class="work-card__cell">
            <p class="work-card__label">Title:</p>
            <h2 class="work-card__title" data-oval>Persimmons</h2>
          </div>
          <div class="work-card__cell">
            <p class="work-card__label">Year:</p>
            <p class="work-card__value work-card__year">2026</p>
          </div>
        </a>
        <span class="arrow-button card__arrow" aria-hidden="true"><img class="icon" src="images/icons/arrow-north-east.svg" alt=""></span>
        <!-- Three views: one large photo, two square close-ups stacked beside it -->
        <div class="work-gallery">
          <img class="work-gallery__main" src="images/ceramics/_parked/persimmons-hero-group-card.avif" data-full="images/ceramics/_parked/persimmons-hero-group-large.avif" width="1720" height="1256" loading="lazy" alt="Three ceramic persimmons with glazed green leaves and twisted stems on a blue backdrop">
          <img src="images/ceramics/_parked/persimmon-1-square.avif" data-full="images/ceramics/_parked/persimmon-1-square-large.avif" width="1300" height="1300" loading="lazy" alt="Persimmon 1: a squat, upright ceramic persimmon with a glazed leaf cap and a twisted stem, seen from above at an angle">
          <img src="images/ceramics/_parked/persimmon-2-square.avif" data-full="images/ceramics/_parked/persimmon-2-square-large.avif" width="1300" height="1300" loading="lazy" alt="Persimmon 2: a ceramic persimmon lying on its side with a ruffled green leaf cap">
        </div>
      </article>
