<!--
  PARKED: the second ("mosaic") style of ceramics cards from ceramics.html,
  saved exactly as they were on 2026-11-16 when the page switched to just
  the 2 x 2 grid of hero squares (each linking to its work's page). This
  file is not a page and is never published (scripts/build.sh skips the
  parked/ folder). Their styles are still in css/styles.css
  (.work-card--mosaic, .work-mosaic, .work-card__note), so to bring a card
  back, paste its <article> into the right column of ceramics.html
  (<div class="home__right">). The first style of cards is in
  parked/ceramics-v1-cards.html.
-->

      <!-- Ceramics cards: complete on their own (no link to a separate
           page); the old v1 cards are saved in parked/ceramics-v1-cards.html.
           Persimmons: Title on the left of the top
           strip, year and materials on the right; then each persimmon as one
           large photo with two detail squares beside it. -->
      <article class="box card work-card work-card--mosaic">
        <div class="work-card__head">
          <div class="work-card__cell">
            <p class="work-card__label">Title:</p>
            <h2 class="work-card__title">Persimmons</h2>
          </div>
          <!-- Year and materials, no labels, in the small serif -->
          <div class="work-card__cell">
            <p class="work-card__label work-card__note work-card__note--year">2026</p>
            <p class="work-card__label work-card__note">Stoneware, oxide washes, underglaze, glaze</p>
          </div>
        </div>
        <div class="work-mosaic">
          <!-- Persimmon 1: one large photo, two details beside it -->
          <img class="work-mosaic__main" src="images/ceramics/persimmon-fuyu/persimmon-1-high-angle.avif" data-full="images/ceramics/persimmon-fuyu/persimmon-1-high-angle-large.avif" width="1600" height="1398" loading="lazy" alt="Persimmon 1: a squat, upright ceramic persimmon with a glazed leaf cap and a twisted stem, seen from above at an angle">
          <img src="images/ceramics/persimmon-fuyu/persimmon-1-side-view.avif" data-full="images/ceramics/persimmon-fuyu/persimmon-1-side-view-large.avif" width="1300" height="998" loading="lazy" alt="Persimmon 1 from the side, showing its low, lobed body and long twisted stem">
          <img src="images/ceramics/persimmon-fuyu/persimmon-1-top-down.avif" data-full="images/ceramics/persimmon-fuyu/persimmon-1-top-down-large.avif" width="1300" height="998" loading="lazy" alt="Persimmon 1 from directly above: a four-part glazed leaf cap with a stem lying across it">
          <!-- Persimmon 2: same arrangement -->
          <img class="work-mosaic__main" src="images/ceramics/persimmon-hachiya/persimmon-2-side-view.avif" data-full="images/ceramics/persimmon-hachiya/persimmon-2-side-view-large.avif" width="1600" height="1400" loading="lazy" alt="Persimmon 2: a ceramic persimmon lying on its side, with a ruffled green leaf cap and a short stem">
          <img src="images/ceramics/persimmon-hachiya/persimmon-2-lid-off.avif" data-full="images/ceramics/persimmon-hachiya/persimmon-2-lid-off-large.avif" width="1300" height="1000" loading="lazy" alt="Persimmon 2 opened: the hollow body beside its glazed leaf-cap lid">
          <img src="images/ceramics/persimmon-hachiya/persimmon-2-top-down.avif" data-full="images/ceramics/persimmon-hachiya/persimmon-2-top-down-large.avif" width="1300" height="998" loading="lazy" alt="Persimmon 2 from directly above, lying on its side with the leaf cap to the right">
        </div>
      </article>
